[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron"
version = "0.1.0"
description = "JARVIS-style personal AI desktop assistant for Windows"
requires-python = ">=3.12"
# Runtime dependencies: ONLY what production code actually imports.
# Desktop automation uses built-in Windows APIs (PowerShell, System.Drawing)
# so no psutil/Pillow/pywin32 are needed.
dependencies = [
    "google-genai>=1.0.0",  # GeminiProvider
    "httpx>=0.27.0",        # NVIDIAProvider (OpenAI-compatible HTTP)
    "pyautogui>=0.9.54",
    "pyttsx3>=2.99",
    "speechrecognition>=3.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
desktop = [
    "pystray>=0.19.0",     # System tray icon
    "Pillow>=10.0.0",      # Icon generation for pystray
    "pyinstaller>=6.0.0",  # Bundling for distribution
]

[project.scripts]
ultron = "ultron.cli:main"
jarvis = "desktop.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultron*", "desktop*"]

[tool.pytest.ini_options]
# Real E2E tests call third-party model APIs and can incur costs.  Keep the
# default validation deterministic; run them explicitly with `-m real_e2e`.
addopts = "-m 'not real_e2e'"
markers = [
    "real_e2e: tests that call live model providers and external services",
]
