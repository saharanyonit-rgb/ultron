[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
[project]
name = "ultron"
version = "0.1.0"
description = "JARVIS-style personal AI desktop assistant - 11 LLM providers, 60+ tools, 6 specialized brains"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "saharanyonit-rgb" }]
keywords = ["ai", "assistant", "jarvis", "llm", "desktop", "agent", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "pyautogui>=0.9.54",
    "pyttsx3>=2.99",
    "speechrecognition>=3.17.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
desktop = [
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "pywebview>=5.0.0",
    "pyinstaller>=6.0.0",
]
[project.urls]
Homepage = "https://github.com/saharanyonit-rgb/ultron"
"Bug Tracker" = "https://github.com/saharanyonit-rgb/ultron/issues"
Changelog = "https://github.com/saharanyonit-rgb/ultron/blob/main/CHANGELOG.md"
Documentation = "https://github.com/saharanyonit-rgb/ultron/blob/main/ARCHITECTURE.md"
[project.scripts]
ultron = "ultron.cli:main"
jarvis = "desktop.main:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["ultron*", "desktop*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "agenticSeek", "Vane", "ui-ux-pro-max-skill", "ultron/skills"]
addopts = "-m 'not real_e2e'"
markers = [
    "real_e2e: tests that call live model providers and external services",
]
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "agenticSeek",
    "Vane",
    "ui-ux-pro-max-skill",
    "ultron/skills",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
[tool.ruff.lint.isort]
known-first-party = ["ultron", "desktop"]
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "agenticSeek/",
    "Vane/",
    "ui-ux-pro-max-skill/",
    "ultron/skills/",
    "build/",
    "dist/",
    "\\.venv/",
]

