name: Feature Request
description: Suggest a new tool, brain, provider, or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [New Tool, New LLM Provider, New Brain, Memory System, UI/Frontend, Android, Desktop, Security, Performance, Documentation, Other]
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
